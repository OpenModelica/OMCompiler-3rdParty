name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.build-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release, Debug]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gfortran \
            libblas-dev \
            liblapack-dev

      - name: Configure
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build build -j$(nproc)

  windows:
    name: Windows UCRT64 (${{ matrix.build-type }})
    runs-on: windows-latest
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 #v2.32.0
        with:
          msystem: UCRT64
          update: true
          # "MSYS Makefiles" drives /usr/bin/make from the MSYS subsystem, so
          # that one is not a pacboy (:p / UCRT64) package.
          install: >-
            make
          # :p expands to the mingw-w64-ucrt-x86_64-* package of the same name.
          pacboy: >-
            toolchain:p
            gcc-fortran:p
            cmake:p
            openblas:p

      - name: Configure
        run: |
          cmake -S . -B build -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

      - name: Build
        run: cmake --build build -j$(nproc)

  macos:
    name: macOS (${{ matrix.build-type }})
    runs-on: macos-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        build-type: [Release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install gcc libomp

      - name: Configure
        # ColPack needs OpenMP
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DOpenMP_ROOT=$(brew --prefix libomp)

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)
